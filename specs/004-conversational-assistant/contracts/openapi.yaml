openapi: 3.0.3
info:
  title: Kuri Conversational Support API
  version: 1.0.0
  description: Chat de soporte con tools allow-listed y ownership verificable.
servers:
  - url: http://localhost:3001
paths:
  /api/v1/chat:
    post:
      summary: Send a support chat message
      security:
        - simulatedRole: []
      parameters:
        - name: X-Kuri-Role
          in: header
          required: true
          schema: { type: string, enum: [OPS, SYSTEM] }
        - name: X-Kuri-User-Id
          in: header
          required: true
          description: Simulated trusted user context for ownership validation.
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Spanish assistant response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
components:
  securitySchemes:
    simulatedRole:
      type: apiKey
      in: header
      name: X-Kuri-Role
  schemas:
    ChatRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        conversation_id: { type: string, maxLength: 64 }
        user_id:
          type: string
          maxLength: 64
          description: Informational only; cannot authorize access.
        order_id: { type: string, maxLength: 64 }
        message: { type: string, minLength: 1, maxLength: 4000 }
    ChatResponse:
      type: object
      required: [conversation_id, message]
      properties:
        conversation_id: { type: string }
        message: { type: string }
        intent:
          type: string
          enum: [ORDER_STATUS, CANCEL_ORDER, LATE_ORDER_COMPLAINT, MISSING_ITEMS, OUT_OF_SCOPE]
    Error:
      type: object
      required: [code, message, details, trace_id]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        trace_id: { type: string }
  responses:
    BadRequest:
      description: Invalid request or tool arguments.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Missing or unauthorized role/context.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ProviderUnavailable:
      description: Controlled provider failure; no partial action occurred.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
